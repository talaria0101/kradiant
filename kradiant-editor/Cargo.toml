[package]
name = "kradiant-editor"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
kradiant.workspace = true
dear-imgui-rs = "0.13"
dear-imgui-glow = { version = "0.13", features = ["gl_extensions_support"] }
glow.workspace = true
dear-imgui-winit = "0.13"
winit = "0.30.12"
glutin = { git = "https://github.com/rust-windowing/glutin.git", branch = "0.32.x", version = "0.32.3" }
raw-window-handle = "0.6.2"
glutin-winit = { git = "https://github.com/rust-windowing/glutin.git", branch = "0.32.x", version = "0.5.0" }
rfd = "0.17.2"
glam = { workspace = true, features = ["bytemuck"] }
bytemuck = { workspace = true, features = ["derive"] }
toml.workspace = true
serde = { workspace = true, features = ["derive"] }
num-traits.workspace = true
strum_macros.workspace = true
strum.workspace = true
rayon.workspace = true
log.workspace = true
